[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/filesystem",
    "crates/config",
    "crates/ffi",
    "crates/operations",
    "crates/qt",
    "crates/application",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
