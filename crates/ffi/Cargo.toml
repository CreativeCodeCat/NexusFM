[package]
name = "nexusfm-ffi"
description = "C ABI over the NexusFM core, used by the Qt Widgets frontend"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
nexusfm-core = { path = "../core" }
nexusfm-config = { path = "../config" }
nexusfm-filesystem = { path = "../filesystem" }
nexusfm-operations = { path = "../operations" }

[dev-dependencies]
tempfile = "3"
